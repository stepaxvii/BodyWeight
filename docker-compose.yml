services:
  backend:
    build: ./backend
    container_name: bodyweight-api
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/bodyweight.db
      - BOT_TOKEN=${BOT_TOKEN}
      - SECRET_KEY=${SECRET_KEY}
      - MINI_APP_URL=${MINI_APP_URL}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID:-}
      # RPG City beta gate. Default true (admin-only); set CITY_BETA=false in .env
      # to open the City to everyone (no image rebuild — only a backend recreate).
      - CITY_BETA=${CITY_BETA:-true}
      - DEBUG=true
    volumes:
      - ./data:/app/data
      - ./backend/static:/app/static
    ports:
      - "127.0.0.1:8002:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      # Cold start on the Pi (alembic upgrade + init_db seeding + uvicorn boot) can
      # take ~40-70s. During start_period, failing checks DON'T mark the container
      # unhealthy (it stays "starting"), and the first success flips it to healthy —
      # so `compose up` with the bot's `depends_on: service_healthy` no longer aborts
      # with "dependency failed to start" before the backend finishes booting.
      start_period: 120s

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile.bot
    container_name: bodyweight-bot
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/bodyweight.db
      - BOT_TOKEN=${BOT_TOKEN}
      - SECRET_KEY=${SECRET_KEY}
      - MINI_APP_URL=${MINI_APP_URL}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID:-}
    volumes:
      - ./data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
