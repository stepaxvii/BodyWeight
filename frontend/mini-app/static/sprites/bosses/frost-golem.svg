<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Frost Golem — глыба льда с горящими глазами -->
  <rect width="32" height="32" fill="#0f1729"/>

  <!-- Кристаллы на голове (рога/шипы) -->
  <rect x="6" y="2" width="2" height="4" fill="#bee3f8"/>
  <rect x="7" y="1" width="1" height="3" fill="#ffffff"/>
  <rect x="24" y="2" width="2" height="4" fill="#bee3f8"/>
  <rect x="24" y="1" width="1" height="3" fill="#ffffff"/>
  <rect x="14" y="0" width="4" height="3" fill="#bee3f8"/>
  <rect x="15" y="0" width="2" height="2" fill="#ffffff"/>

  <!-- Голова — глыба льда, неровная -->
  <rect x="5" y="5" width="22" height="20" fill="#1e3a5f"/>
  <rect x="4" y="7" width="2" height="14" fill="#2c5282"/>
  <rect x="26" y="7" width="2" height="14" fill="#2c5282"/>
  <rect x="6" y="6" width="20" height="18" fill="#2c5282"/>
  <rect x="7" y="7" width="18" height="16" fill="#4299e1"/>

  <!-- Свет / трещины -->
  <rect x="9" y="8" width="3" height="1" fill="#bee3f8" opacity="0.7"/>
  <rect x="20" y="9" width="2" height="1" fill="#bee3f8" opacity="0.7"/>
  <rect x="10" y="20" width="4" height="1" fill="#bee3f8" opacity="0.5"/>

  <!-- Глаза — холодные белые с голубым свечением -->
  <rect x="9" y="11" width="6" height="5" fill="#0f1729"/>
  <rect x="17" y="11" width="6" height="5" fill="#0f1729"/>
  <rect x="10" y="12" width="4" height="3" fill="#bee3f8"/>
  <rect x="18" y="12" width="4" height="3" fill="#bee3f8"/>
  <rect x="11" y="13" width="2" height="2" fill="#ffffff"/>
  <rect x="19" y="13" width="2" height="2" fill="#ffffff"/>

  <!-- Злой нахмуренный лоб (тени над глазами) -->
  <rect x="9" y="10" width="6" height="1" fill="#1e3a5f"/>
  <rect x="17" y="10" width="6" height="1" fill="#1e3a5f"/>

  <!-- Рот — зубы льда -->
  <rect x="11" y="18" width="10" height="4" fill="#0f1729"/>
  <rect x="12" y="19" width="1" height="2" fill="#bee3f8"/>
  <rect x="14" y="19" width="1" height="3" fill="#bee3f8"/>
  <rect x="16" y="19" width="1" height="2" fill="#bee3f8"/>
  <rect x="18" y="19" width="1" height="3" fill="#bee3f8"/>
  <rect x="20" y="19" width="1" height="2" fill="#bee3f8"/>

  <!-- Плечи -->
  <rect x="2" y="24" width="28" height="6" fill="#1e3a5f"/>
  <rect x="3" y="25" width="26" height="4" fill="#2c5282"/>
  <rect x="4" y="26" width="3" height="2" fill="#4299e1"/>
  <rect x="25" y="26" width="3" height="2" fill="#4299e1"/>
  <rect x="13" y="26" width="6" height="2" fill="#4299e1"/>
</svg>
