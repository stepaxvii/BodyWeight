  <rect x="19" y="18" width="1" height="3" fill="#f9a8d4"/>
  <rect x="14" y="20" width="4" height="1" fill="#7f1d1d"/>

  <!-- Щупальца -->
  <rect x="2" y="23" width="3" height="3" fill="#831843"/>
  <rect x="3" y="26" width="2" height="3" fill="#be185d"/>
  <rect x="2" y="29" width="3" height="2" fill="#831843"/>

  <rect x="7" y="24" width="2" height="4" fill="#831843"/>
