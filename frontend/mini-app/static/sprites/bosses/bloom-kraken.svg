  <rect x="15" y="22" width="2" height="9" fill="#be185d"/>
  <rect x="19" y="23" width="2" height="6" fill="#be185d"/>
  <rect x="18" y="29" width="3" height="2" fill="#831843"/>

  <rect x="23" y="24" width="2" height="4" fill="#831843"/>
