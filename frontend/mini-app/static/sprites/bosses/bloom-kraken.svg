  <rect x="12" y="17" width="8" height="4" fill="#0f1729"/>
  <rect x="13" y="18" width="1" height="3" fill="#f9a8d4"/>
  <rect x="15" y="18" width="1" height="3" fill="#f9a8d4"/>
