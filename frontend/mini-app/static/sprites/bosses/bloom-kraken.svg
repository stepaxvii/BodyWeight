  <rect x="17" y="11" width="6" height="5" fill="#0f1729"/>
  <rect x="10" y="12" width="4" height="3" fill="#166534"/>
  <rect x="18" y="12" width="4" height="3" fill="#166534"/>
  <rect x="11" y="13" width="2" height="1" fill="#4ade80"/>
  <rect x="19" y="13" width="2" height="1" fill="#4ade80"/>
  <rect x="11" y="13" width="1" height="1" fill="#bbf7d0"/>
