<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Bloom Kraken — цветочно-спрутовый кошмар -->
  <rect width="32" height="32" fill="#0f1729"/>

  <!-- Лепестки цветка -->
  <rect x="14" y="0" width="4" height="3" fill="#831843"/>
  <rect x="15" y="1" width="2" height="2" fill="#ec4899"/>
  <rect x="2" y="6" width="3" height="4" fill="#831843"/>
  <rect x="3" y="7" width="1" height="2" fill="#ec4899"/>
