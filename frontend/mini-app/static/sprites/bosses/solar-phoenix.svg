<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Solar Phoenix — пылающая птица с расправленными крыльями -->
  <rect width="32" height="32" fill="#0f1729"/>

  <!-- Внешние перья крыльев -->
  <rect x="0" y="10" width="2" height="3" fill="#7c2d12"/>
  <rect x="1" y="13" width="2" height="3" fill="#c2410c"/>
  <rect x="0" y="16" width="2" height="3" fill="#f97316"/>
  <rect x="30" y="10" width="2" height="3" fill="#7c2d12"/>
  <rect x="29" y="13" width="2" height="3" fill="#c2410c"/>
  <rect x="30" y="16" width="2" height="3" fill="#f97316"/>

  <!-- Крылья развёрнуты -->
  <rect x="2" y="9" width="4" height="14" fill="#7c2d12"/>
  <rect x="26" y="9" width="4" height="14" fill="#7c2d12"/>
  <rect x="3" y="10" width="3" height="12" fill="#c2410c"/>
  <rect x="26" y="10" width="3" height="12" fill="#c2410c"/>
  <rect x="4" y="11" width="2" height="10" fill="#f97316"/>
  <rect x="26" y="11" width="2" height="10" fill="#f97316"/>
  <rect x="4" y="12" width="1" height="2" fill="#fbbf24"/>
  <rect x="27" y="12" width="1" height="2" fill="#fbbf24"/>
  <rect x="4" y="17" width="1" height="2" fill="#fbbf24"/>
  <rect x="27" y="17" width="1" height="2" fill="#fbbf24"/>

  <!-- Гребень / корона из перьев -->
  <rect x="14" y="0" width="4" height="3" fill="#fbbf24"/>
  <rect x="15" y="0" width="2" height="2" fill="#fef3c7"/>
  <rect x="11" y="2" width="2" height="3" fill="#f97316"/>
  <rect x="19" y="2" width="2" height="3" fill="#f97316"/>
  <rect x="9" y="4" width="2" height="2" fill="#c2410c"/>
  <rect x="21" y="4" width="2" height="2" fill="#c2410c"/>

  <!-- Голова — пламенная -->
  <rect x="8" y="5" width="16" height="14" fill="#7c2d12"/>
  <rect x="9" y="6" width="14" height="12" fill="#c2410c"/>
  <rect x="10" y="7" width="12" height="10" fill="#f97316"/>
  <rect x="11" y="8" width="10" height="8" fill="#fbbf24"/>

  <!-- Глаза — белые, как звёзды -->
  <rect x="11" y="9" width="3" height="3" fill="#0f1729"/>
  <rect x="18" y="9" width="3" height="3" fill="#0f1729"/>
  <rect x="12" y="10" width="2" height="1" fill="#ffffff"/>
  <rect x="19" y="10" width="2" height="1" fill="#ffffff"/>
  <rect x="12" y="10" width="1" height="1" fill="#fef3c7"/>
  <rect x="19" y="10" width="1" height="1" fill="#fef3c7"/>

  <!-- Клюв -->
  <rect x="14" y="13" width="4" height="3" fill="#fbbf24"/>
  <rect x="15" y="14" width="2" height="3" fill="#fef3c7"/>
  <rect x="14" y="16" width="4" height="1" fill="#7c2d12"/>

  <!-- Грудь / тело пернатое -->
  <rect x="10" y="19" width="12" height="8" fill="#7c2d12"/>
  <rect x="11" y="20" width="10" height="6" fill="#c2410c"/>
  <rect x="12" y="21" width="8" height="4" fill="#f97316"/>

  <!-- Хвост — пламя -->
  <rect x="13" y="27" width="6" height="3" fill="#7c2d12"/>
  <rect x="14" y="28" width="4" height="3" fill="#c2410c"/>
  <rect x="15" y="29" width="2" height="3" fill="#fbbf24"/>
  <rect x="11" y="29" width="2" height="2" fill="#c2410c"/>
  <rect x="19" y="29" width="2" height="2" fill="#c2410c"/>
</svg>
