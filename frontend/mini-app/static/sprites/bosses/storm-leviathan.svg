<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Storm Leviathan — змей-чудовище с молниями -->
  <rect width="32" height="32" fill="#0f1729"/>

  <!-- Молнии вокруг -->
  <rect x="2" y="2" width="1" height="2" fill="#fef08a"/>
  <rect x="3" y="4" width="1" height="2" fill="#fbbf24"/>
  <rect x="2" y="6" width="2" height="1" fill="#fef08a"/>

  <rect x="29" y="3" width="1" height="2" fill="#fef08a"/>
  <rect x="28" y="5" width="1" height="2" fill="#fbbf24"/>
  <rect x="28" y="7" width="2" height="1" fill="#fef08a"/>

  <!-- Рога -->
  <rect x="5" y="2" width="2" height="5" fill="#1f2937"/>
  <rect x="6" y="3" width="1" height="3" fill="#475569"/>
  <rect x="25" y="2" width="2" height="5" fill="#1f2937"/>
  <rect x="25" y="3" width="1" height="3" fill="#475569"/>

  <!-- Голова — массивная, чешуйчатая -->
  <rect x="4" y="6" width="24" height="16" fill="#1e3a5f"/>
  <rect x="5" y="7" width="22" height="14" fill="#2563eb"/>
  <rect x="6" y="8" width="20" height="12" fill="#475569"/>

  <!-- Чешуя -->
  <rect x="7" y="9" width="2" height="1" fill="#1e3a5f"/>
  <rect x="11" y="9" width="2" height="1" fill="#1e3a5f"/>
  <rect x="15" y="9" width="2" height="1" fill="#1e3a5f"/>
  <rect x="19" y="9" width="2" height="1" fill="#1e3a5f"/>
  <rect x="23" y="9" width="2" height="1" fill="#1e3a5f"/>
  <rect x="9" y="11" width="2" height="1" fill="#1e3a5f"/>
  <rect x="13" y="11" width="2" height="1" fill="#1e3a5f"/>
  <rect x="17" y="11" width="2" height="1" fill="#1e3a5f"/>
  <rect x="21" y="11" width="2" height="1" fill="#1e3a5f"/>

  <!-- Брови / шипы -->
  <rect x="7" y="11" width="6" height="1" fill="#1f2937"/>
  <rect x="19" y="11" width="6" height="1" fill="#1f2937"/>
  <rect x="8" y="10" width="2" height="1" fill="#1f2937"/>
  <rect x="22" y="10" width="2" height="1" fill="#1f2937"/>

  <!-- Глаза — электрические молнии -->
  <rect x="8" y="12" width="6" height="4" fill="#0f1729"/>
  <rect x="18" y="12" width="6" height="4" fill="#0f1729"/>
  <rect x="9" y="13" width="4" height="2" fill="#2563eb"/>
  <rect x="19" y="13" width="4" height="2" fill="#2563eb"/>
  <rect x="10" y="13" width="2" height="2" fill="#fef08a"/>
  <rect x="20" y="13" width="2" height="2" fill="#fef08a"/>
  <rect x="10" y="13" width="1" height="1" fill="#ffffff"/>
  <rect x="20" y="13" width="1" height="1" fill="#ffffff"/>

  <!-- Открытая пасть с молнией -->
  <rect x="9" y="17" width="14" height="5" fill="#0f1729"/>
  <rect x="10" y="18" width="1" height="4" fill="#cbd5e0"/>
  <rect x="13" y="18" width="1" height="4" fill="#cbd5e0"/>
  <rect x="18" y="18" width="1" height="4" fill="#cbd5e0"/>
  <rect x="21" y="18" width="1" height="4" fill="#cbd5e0"/>
  <!-- Молния в пасти -->
  <rect x="14" y="18" width="1" height="2" fill="#fef08a"/>
  <rect x="15" y="20" width="1" height="1" fill="#fef08a"/>
  <rect x="16" y="18" width="1" height="2" fill="#fef08a"/>
  <rect x="17" y="20" width="1" height="1" fill="#fef08a"/>

  <!-- Шея/тело -->
  <rect x="6" y="22" width="20" height="8" fill="#1e3a5f"/>
  <rect x="7" y="23" width="18" height="7" fill="#2563eb"/>
  <rect x="8" y="24" width="16" height="5" fill="#475569"/>

  <!-- Шипы на шее -->
  <rect x="9" y="22" width="1" height="2" fill="#fef08a"/>
  <rect x="14" y="22" width="1" height="2" fill="#fef08a"/>
  <rect x="19" y="22" width="1" height="2" fill="#fef08a"/>
  <rect x="23" y="22" width="1" height="2" fill="#fef08a"/>
</svg>
