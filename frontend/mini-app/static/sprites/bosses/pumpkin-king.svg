<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Pumpkin King — король хэллоуина с короной -->
  <rect width="32" height="32" fill="#0f1729"/>

  <!-- Корона (зубцы) -->
  <rect x="6" y="0" width="2" height="3" fill="#fcd34d"/>
  <rect x="10" y="0" width="2" height="4" fill="#fcd34d"/>
  <rect x="14" y="0" width="4" height="3" fill="#fcd34d"/>
  <rect x="20" y="0" width="2" height="4" fill="#fcd34d"/>
  <rect x="24" y="0" width="2" height="3" fill="#fcd34d"/>
  <!-- Корона (основание) -->
  <rect x="5" y="3" width="22" height="3" fill="#ca8a04"/>
  <rect x="6" y="4" width="20" height="2" fill="#fcd34d"/>
  <!-- Камни в короне -->
  <rect x="10" y="4" width="1" height="1" fill="#84cc16"/>
  <rect x="15" y="4" width="2" height="1" fill="#dc2626"/>
  <rect x="21" y="4" width="1" height="1" fill="#84cc16"/>

  <!-- Хвостик тыквы -->
  <rect x="14" y="0" width="2" height="2" fill="#166534"/>
  <rect x="15" y="-1" width="1" height="3" fill="#166534"/>

  <!-- Голова-тыква -->
  <rect x="3" y="6" width="26" height="22" fill="#7c2d12"/>
  <rect x="2" y="9" width="28" height="16" fill="#7c2d12"/>
  <rect x="4" y="7" width="24" height="20" fill="#c2410c"/>
  <rect x="3" y="10" width="26" height="14" fill="#c2410c"/>
  <rect x="5" y="8" width="22" height="18" fill="#ea580c"/>
  <rect x="4" y="11" width="24" height="12" fill="#ea580c"/>
  <rect x="6" y="9" width="20" height="16" fill="#fb923c"/>

  <!-- Сегменты тыквы -->
  <rect x="11" y="7" width="1" height="20" fill="#7c2d12"/>
  <rect x="20" y="7" width="1" height="20" fill="#7c2d12"/>
  <rect x="2" y="15" width="2" height="2" fill="#7c2d12"/>
  <rect x="28" y="15" width="2" height="2" fill="#7c2d12"/>

  <!-- Глаза-треугольники со светом -->
  <rect x="8" y="12" width="6" height="5" fill="#1a1a2e"/>
  <rect x="9" y="13" width="4" height="3" fill="#fcd34d"/>
  <rect x="10" y="14" width="2" height="2" fill="#84cc16"/>
  <rect x="10" y="14" width="1" height="1" fill="#bef264"/>

  <rect x="18" y="12" width="6" height="5" fill="#1a1a2e"/>
  <rect x="19" y="13" width="4" height="3" fill="#fcd34d"/>
  <rect x="20" y="14" width="2" height="2" fill="#84cc16"/>
  <rect x="20" y="14" width="1" height="1" fill="#bef264"/>

  <!-- Нос-треугольник -->
  <rect x="14" y="15" width="4" height="3" fill="#1a1a2e"/>
  <rect x="15" y="15" width="2" height="2" fill="#fcd34d"/>

  <!-- Зубастый ухмыляющийся рот -->
  <rect x="7" y="19" width="18" height="5" fill="#1a1a2e"/>
  <rect x="8" y="20" width="2" height="3" fill="#fcd34d"/>
  <rect x="11" y="20" width="2" height="2" fill="#fcd34d"/>
  <rect x="14" y="20" width="2" height="3" fill="#fcd34d"/>
  <rect x="17" y="20" width="2" height="2" fill="#fcd34d"/>
  <rect x="20" y="20" width="2" height="3" fill="#fcd34d"/>
  <rect x="23" y="20" width="1" height="2" fill="#fcd34d"/>
  <!-- Свет внутри -->
  <rect x="10" y="22" width="12" height="1" fill="#84cc16"/>
</svg>
