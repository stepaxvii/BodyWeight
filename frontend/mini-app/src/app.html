<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<meta name="theme-color" content="#efe6d4" />

		<script src="https://telegram.org/js/telegram-web-app.js"></script>
		<script>
			// Pixel Operator's UPPERCASE Cyrillic renders as broken glyphs on some
			// Android WebViews (lowercase is fine); text-transform: uppercase triggers
			// it. Tag Android so CSS can render labels in their authored case there
			// (iOS is unaffected and keeps the uppercase look).
			(function () {
				try {
					var tg = window.Telegram && window.Telegram.WebApp;
					var plat = (tg && tg.platform) || '';
					if (plat === 'android' || /Android/i.test(navigator.userAgent)) {
						document.documentElement.classList.add('plat-android');
					}
				} catch (e) {}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<!-- Silkscreen = numbers/data (Latin digits). Pixel Operator (self-hosted) = all text incl. Cyrillic. -->
		<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
		<style>
			@font-face {
				font-family: 'Pixel Operator';
				src: url('%sveltekit.assets%/fonts/PixelOperator.ttf') format('truetype');
				font-weight: 400;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: 'Pixel Operator';
				src: url('%sveltekit.assets%/fonts/PixelOperator-Bold.ttf') format('truetype');
				font-weight: 700;
				font-style: normal;
				font-display: swap;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
